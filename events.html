<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activist Ally - Events</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
</head>
<body>
    <header>
        <nav>
            <h1>Activist Ally</h1>
            <ul>
                <li><a href="events.html">Events</a></li>
                <li><a href="my-events.html">My Events</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="project-management.html">Project Management</a></li>
                <li><a href="multi-step-form.html">Multi-Step Form</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="events-section">
            <h2>Upcoming Events</h2>
            <p>Register for events that are coming soon!</p>

            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month">❮</button>
                    <h3 id="month-year"></h3>
                    <button id="next-month">❯</button>
                </div>
                <div id="calendar"></div>
            </div>
        </section>
    </main>

    <!-- Registration Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h3>Register for Event</h3>
            <form id="register-form">
                <label for="event-name">Event Name:</label>
                <input type="text" id="event-name" required>
                <label for="event-description">Event Description:</label>
                <textarea id="event-description" required></textarea>
                <label for="volunteer-name">Your Name:</label>
                <input type="text" id="volunteer-name" required>
                <label for="volunteer-email">Your Email:</label>
                <input type="email" id="volunteer-email" required>
                <label for="volunteer-phone">Your Phone:</label>
                <input type="tel" id="volunteer-phone" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
